<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1080" height="600" fill="#f5f5f5"/>

  <!-- Header -->
  <text x="40" y="48" fill="#4f5d75" font-size="12" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">ARCHITECTURE · DIAGRAM-DESIGN PNG EXPORT</text>
  <text x="40" y="88" fill="#2d3142" font-size="32" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">SVG &#8594; PNG font pipeline</text>

  <!-- Arrows (before boxes) -->
  <!-- Main chain -->
  <line x1="168" y1="216" x2="204" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="368" y1="216" x2="404" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="584" y1="216" x2="620" y2="216" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="800" y1="216" x2="836" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Resolver fan-out to four tiers -->
  <line x1="440" y1="256" x2="160" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="472" y1="256" x2="416" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="504" y1="256" x2="664" y2="360" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="536" y1="256" x2="916" y2="360" stroke="#2e5aa8" stroke-width="1" marker-end="url(#arrow-link)"/>
  <!-- Write-back: Google Fonts -> Disk cache -->
  <path d="M 924 448 L 924 480 L 412 480 L 412 456" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <rect x="620" y="474" width="96" height="12" rx="2" fill="#f5f5f5"/>
  <text x="668" y="483" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CACHE WRITE</text>

  <!-- Main row -->
  <!-- SVG file (input) -->
  <rect x="40" y="176" width="128" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="40" y="176" width="128" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
  <rect x="48" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
  <text x="62" y="191" fill="rgba(122,131,153,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
  <text x="104" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">SVG file</text>
  <text x="104" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@import + attrs</text>

  <!-- Font scanner -->
  <rect x="208" y="176" width="160" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="208" y="176" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="216" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="230" y="191" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SCAN</text>
  <text x="288" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Font scanner</text>
  <text x="288" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">families + weights</text>

  <!-- Family resolver (focal) -->
  <rect x="408" y="176" width="176" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="408" y="176" width="176" height="80" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="416" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
  <text x="430" y="191" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
  <text x="496" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Family resolver</text>
  <text x="496" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">T1 &#8594; T4 ladder</text>

  <!-- resvg / fontdb -->
  <rect x="624" y="176" width="176" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="624" y="176" width="176" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="632" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
  <text x="646" y="191" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WASM</text>
  <text x="712" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">resvg · fontdb</text>
  <text x="712" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fontBuffers[]</text>

  <!-- PNG out -->
  <rect x="840" y="176" width="128" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="840" y="176" width="128" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="848" y="182" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="862" y="191" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OUT</text>
  <text x="904" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">PNG file</text>
  <text x="904" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deterministic</text>

  <!-- Tier row -->
  <!-- T1 Vendored fonts (store) -->
  <rect x="52" y="368" width="208" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="52" y="368" width="208" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="60" y="374" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="74" y="383" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T1</text>
  <text x="156" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Vendored fonts</text>
  <text x="156" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">skill assets · 692KB</text>

  <!-- T2 Disk cache (store) -->
  <rect x="308" y="368" width="208" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="308" y="368" width="208" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <rect x="316" y="374" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
  <text x="330" y="383" fill="rgba(79,93,117,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T2</text>
  <text x="412" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Disk cache</text>
  <text x="412" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">~/.cache/diagram-fonts</text>

  <!-- T3 System fonts (external) -->
  <rect x="564" y="368" width="208" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="564" y="368" width="208" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="572" y="374" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="586" y="383" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T3</text>
  <text x="668" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">System fonts</text>
  <text x="668" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/Library/Fonts &#8230;</text>

  <!-- T4 Google Fonts (external) -->
  <rect x="820" y="368" width="208" height="80" rx="6" fill="#f5f5f5"/>
  <rect x="820" y="368" width="208" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <rect x="828" y="374" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
  <text x="842" y="383" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">T4</text>
  <text x="924" y="412" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Google Fonts</text>
  <text x="924" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">css2 &#8594; ttf direct</text>

  <!-- Legend -->
  <line x1="40" y1="524" x2="1040" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="160" y="536" width="28" height="16" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="196" y="552" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Focal stage</text>
  <rect x="320" y="536" width="28" height="16" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
  <text x="356" y="552" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Store / cache</text>
  <rect x="492" y="536" width="28" height="16" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
  <text x="528" y="552" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">External</text>
  <line x1="640" y1="544" x2="676" y2="544" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
  <text x="688" y="552" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Network call</text>
  <line x1="812" y1="544" x2="848" y2="544" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="860" y="552" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, sans-serif">Write-back</text>
</svg>
