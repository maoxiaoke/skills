# Component tokens are optional. Add only components supported by repeated
# source evidence. Variants are separate related entries.

[components]

# Example:
# [components.button-primary]
# backgroundColor = "{colors.primary}"
# textColor = "{colors.on-primary}"
# typography = "{typography.label-lg}"
# rounded = "{rounded.md}"
# padding = "{spacing.sm}"
# height = "2.5rem" # 40px
#
# [components.button-primary-hover]
# backgroundColor = "{colors.primary-hover}"

