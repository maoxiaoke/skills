# Framework-neutral design token template inspired by Google Stitch DESIGN.md.
# Specification: https://stitch.withgoogle.com/docs/design-md/specification/
#
# This TOML represents the machine-readable token layer. Empty values are
# fields to populate; concrete examples appear only in comments. Unknown token
# names and extension tables are allowed when their values are valid.
#
# Tailwind export is deterministic rather than duplicated:
# colors.primary                  -> --color-primary
# fonts.sans                      -> --font-sans
# typography.body-md.fontSize     -> --text-body-md
# typography.body-md.lineHeight   -> --text-body-md--line-height
# spacing.sm                      -> --spacing-sm
# rounded.md                      -> --radius-md
# breakpoints.md                  -> --breakpoint-md
# containers.content             -> --container-content
# shadows.sm                      -> --shadow-sm
# motion.ease-standard            -> --ease-standard
# motion.animate-fade-in          -> --animate-fade-in

version = "alpha"
name = ""
description = ""

# Example:
# name = "Northstar Web"
# description = "Calm, compact, content-first interface."

[metadata]
platforms = []
defaultTheme = ""
availableThemes = []

# Example:
# platforms = ["web", "responsive-web"]
# defaultTheme = "light"
# availableThemes = ["light", "dark"]

# Scalable dimensions use rem as the canonical value. The root size makes px
# conversion deterministic. Keep fixed icon sizes, strokes, and hairlines in px.

[units]
rootFontSizePx = 16
scalableUnit = "rem"
fixedUnit = "px"
outputs = ["rem", "px"]

# Example:
# fontSize = "1rem" # 16px
# section = "3rem" # 48px
# defaultSize = "20px" # fixed icon size

# Base font-family tokens and loading metadata. Typography roles reference these
# primitives with Stitch-style paths such as {fonts.sans}.

[fonts]
sans = ""
mono = ""
serif = ""
sansSource = ""
monoSource = ""
serifSource = ""
loading = ""

# Example:
# sans = "Inter, ui-sans-serif, system-ui, sans-serif"
# mono = "JetBrains Mono, ui-monospace, SFMono-Regular, monospace"
# serif = ""
# sansSource = "@fontsource/inter"
# monoSource = "self-hosted"
# serifSource = ""
# loading = "woff2 with font-display: swap"

# Iconography is an open extension to the Stitch core schema.

[icons]
library = ""
package = ""
source = ""
format = ""
style = ""
defaultSize = ""
sizes = []
strokeWidth = ""
strokeLinecap = ""
strokeLinejoin = ""
fill = ""
color = ""

# Example:
# library = "Lucide"
# package = "lucide-react"
# source = "https://lucide.dev/"
# format = "svg-component"
# style = "outline"
# defaultSize = "20px"
# sizes = ["12px", "16px", "20px", "24px"]
# strokeWidth = "1.5px"
# strokeLinecap = "round"
# strokeLinejoin = "round"
# fill = "none"
# color = "currentColor"

# Colors are sRGB hex values. Token references use {path.to.token}. Names are
# semantic and extensible; raw palette steps may live in this same flat map.

[colors]
background = ""
foreground = ""
surface = ""
"on-surface" = ""
"surface-muted" = ""
muted = ""
"on-muted" = ""
border = ""
"border-strong" = ""
ring = ""
overlay = ""
primary = ""
"on-primary" = ""
"primary-hover" = ""
"primary-active" = ""
secondary = ""
"on-secondary" = ""
"secondary-hover" = ""
"secondary-active" = ""
tertiary = ""
"on-tertiary" = ""
info = ""
"on-info" = ""
success = ""
"on-success" = ""
warning = ""
"on-warning" = ""
error = ""
"on-error" = ""

# Examples:
# background = "#F8FAFC"
# foreground = "#0F172A"
# surface = "#FFFFFF"
# "on-surface" = "#0F172A"
# border = "#E2E8F0"
# ring = "#3B82F6"
# overlay = "#0F172A8F"
# primary = "#2563EB"
# "on-primary" = "#FFFFFF"
# "primary-hover" = "#1D4ED8"
# secondary = "#F1F5F9"
# "on-secondary" = "#0F172A"
# error = "#EF4444"
# "on-error" = "#FFFFFF"
# "neutral-50" = "#F8FAFC"
# "neutral-900" = "#0F172A"

