<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 636" width="1080" height="636">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper) -->
  <rect width="1080" height="636" fill="#f5f5f5"/>

  <!-- Header: eyebrow + title -->
  <text x="40" y="48" fill="#4f5d75" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">VENN · DIAGRAM DESIGN</text>
  <text x="40" y="88" fill="#2d3142" font-size="30" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Good design · Desirable × Feasible × Viable</text>

  <!-- Diagram (original inline SVG content, repositioned) -->
  <g transform="translate(40,116)">
        <defs>
          <!-- Chained clips isolate the all-three intersection: clip to Desirable, then to Feasible, then fill via the third circle. -->
          <clipPath id="clip-desirable">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-feasible">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="1000" height="480" fill="#f5f5f5"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle cx="500" cy="180" r="140" fill="rgba(45,49,66,0.04)" stroke="#2d3142" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle cx="428" cy="320" r="140" fill="rgba(79,93,117,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle cx="572" cy="320" r="140" fill="rgba(122,131,153,0.05)" stroke="#7a8399" stroke-width="1"/>

        <!-- Focal: solid-ink triple intersection (dark fill for white text to read against) -->
        <g clip-path="url(#clip-desirable)">
          <g clip-path="url(#clip-feasible)">
            <circle cx="572" cy="320" r="140" fill="#2d3142"/>
          </g>
        </g>

        <!-- Set labels — positioned INSIDE each circle's non-overlapping lobe, so the diagram reads like a classic Venn -->
        <!-- Desirable — top lobe (centered inside top of Desirable circle) -->
        <text x="500" y="96" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Desirable</text>
        <text x="500" y="112" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">PEOPLE WANT IT</text>

        <!-- Feasible — bottom-left lobe -->
        <text x="340" y="386" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Feasible</text>
        <text x="340" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">WE CAN BUILD IT</text>

        <!-- Viable — bottom-right lobe -->
        <text x="660" y="386" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Viable</text>
        <text x="660" y="402" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">BUSINESS SUSTAINS</text>

        <!-- Focal label: white text on the dark intersection -->
        <text x="500" y="268" fill="#ffffff" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Shippable</text>
        <text x="500" y="284" fill="rgba(245,245,245,0.75)" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">THE SWEET SPOT</text>
  </g>
</svg>
