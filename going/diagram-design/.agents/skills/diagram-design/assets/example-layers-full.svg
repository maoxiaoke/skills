<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 1092" width="1128" height="1092">
  <style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
  </style>

  <!-- Page background (paper) + full-bleed dots -->
  <rect width="1128" height="1092" fill="#f5f5f5"/>
  <rect width="1128" height="1092" fill="url(#dots)" opacity="0.55"/>

  <!-- Page header (redrawn from the HTML wrapper) -->
  <text x="40" y="48" fill="#4f5d75" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LAYER STACK · DIAGRAM DESIGN</text>
  <text x="40" y="96" fill="#2d3142" font-size="40" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">AI app stack · Where the work actually happens</text>
  <text x="40" y="126" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="40" dy="0">Five layers between silicon and the user. Most teams over-invest</tspan>
    <tspan x="40" dy="25">in the model and under-invest in the harness — which is the layer</tspan>
    <tspan x="40" dy="25">that decides whether the app feels magical or flaky.</tspan>
  </text>

  <!-- Diagram container (rounded box with paper-2 fill + hairline border) -->
  <rect x="40" y="220" width="1048" height="548" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Diagram (original inline SVG content, repositioned inside the container) -->
  <g transform="translate(64, 244)">
    <defs>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
      </pattern>
    </defs>

    <rect width="1000" height="500" fill="#f5f5f5"/>
    <rect width="1000" height="500" fill="url(#dots)" opacity="0.55"/>

    <!-- Direction column (left margin) -->
    <text x="60" y="68" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">ABSTRACTION</text>
    <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
    <polygon points="76,80 84,80 80,72" fill="#4f5d75"/>
    <text x="60" y="416" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">SILICON</text>

    <!-- Stack container hairlines (top + bottom edges) -->
    <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

    <!-- L5 — UI (top layer, near-white fill) -->
    <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
    <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="140" y="116" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L5</text>
    <text x="260" y="118" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">UI surface</text>
    <text x="940" y="118" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.08em">chat, editor, canvas</text>

    <!-- L4 — Agent harness (FOCAL, coral tint + coral stroke) -->
    <rect x="120" y="144" width="840" height="64" fill="rgba(235,108,54,0.08)"/>
    <rect x="120" y="144" width="840" height="64" fill="none" stroke="#eb6c36" stroke-width="1"/>
    <text x="140" y="180" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em" font-weight="600">L4</text>
    <text x="260" y="182" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Agent harness</text>
    <text x="940" y="182" fill="#eb6c36" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.08em">tools, memory, loop</text>

    <!-- L3 — Prompt layer -->
    <rect x="120" y="208" width="840" height="64" fill="#f5f5f5"/>
    <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="140" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L3</text>
    <text x="260" y="246" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Prompt layer</text>
    <text x="940" y="246" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.08em">system, few-shot, caching</text>

    <!-- L2 — SDK -->
    <rect x="120" y="272" width="840" height="64" fill="#ececec"/>
    <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="140" y="308" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L2</text>
    <text x="260" y="310" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">SDK / client</text>
    <text x="940" y="310" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.08em">auth, retries, streaming</text>

    <!-- L1 — Model -->
    <rect x="120" y="336" width="840" height="64" fill="#ececec"/>
    <text x="140" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">L1</text>
    <text x="260" y="374" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Model weights</text>
    <text x="940" y="374" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.08em">opus, sonnet, haiku</text>

    <!-- Caption -->
    <text x="120" y="456" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">FOCAL LAYER</text>
    <text x="240" y="456" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-style="italic">The harness is where most product differentiation actually lives — tools, memory, and the loop that stitches model calls into useful work.</text>
  </g>

  <!-- Explanation cards (redrawn from the HTML card grid) -->
  <!-- Card 1 — The headline (coral dot) -->
  <rect x="40" y="792" width="372" height="196" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="60" y="819" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
  <circle cx="63.5" cy="838" r="3.5" fill="#eb6c36"/>
  <text x="77" y="843" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Coral marks the layer that pays rent</text>
  <line x1="60" y1="861" x2="392" y2="861" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="60" y="881" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="60" dy="0">Swapping models is a knob. Rewriting the</tspan>
    <tspan x="60" dy="20">harness is a product decision. The coral band</tspan>
    <tspan x="60" dy="20">says: this is the layer where you out-execute</tspan>
    <tspan x="60" dy="20">the competition, not the one where you</tspan>
    <tspan x="60" dy="20">chase leaderboards.</tspan>
  </text>

  <!-- Card 2 — Reading the stack (ink dot, dash list) -->
  <rect x="428" y="792" width="339" height="196" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="451.5" cy="818" r="3.5" fill="#2d3142"/>
  <text x="465" y="823" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Reading the stack</text>
  <line x1="448" y1="841" x2="747" y2="841" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="448" y="864" fill="rgba(45,49,66,0.25)" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">—</text>
  <text x="465" y="864" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Abstraction rises up the left column</text>
  <text x="448" y="888" fill="rgba(45,49,66,0.25)" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">—</text>
  <text x="465" y="888" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">L-index on the left, note on the right</text>
  <text x="448" y="912" fill="rgba(45,49,66,0.25)" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">—</text>
  <text x="465" y="912" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Hairlines between layers, no shadows</text>
  <text x="448" y="936" fill="rgba(45,49,66,0.25)" font-size="12" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">—</text>
  <text x="465" y="936" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Fill shade shifts from paper-2 to white</text>

  <!-- Card 3 — Why only five (muted dot) -->
  <rect x="783" y="792" width="305" height="196" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="806.5" cy="818" r="3.5" fill="#4f5d75"/>
  <text x="820" y="823" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Why only five</text>
  <line x1="803" y1="841" x2="1068" y2="841" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="803" y="861" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="803" dy="0">Six-plus layers become a legend, not</tspan>
    <tspan x="803" dy="20">a diagram. Five holds the whole thing</tspan>
    <tspan x="803" dy="20">on one screen — every band readable</tspan>
    <tspan x="803" dy="20">without squinting, every note a scan</tspan>
    <tspan x="803" dy="20">away.</tspan>
  </text>

  <!-- Footer (top rule + left/right mono labels) -->
  <line x1="40" y1="1020" x2="1088" y2="1020" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="40" y="1052" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">ai app stack · layer hierarchy</text>
  <text x="1088" y="1052" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
