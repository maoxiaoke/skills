<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 656" width="1080" height="656">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper, dark) -->
  <rect width="1080" height="656" fill="#2d3142"/>

  <!-- Header: eyebrow + title -->
  <text x="40" y="48" fill="#bfc0c0" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">VENN · DIAGRAM DESIGN</text>
  <text x="40" y="88" fill="#f5f5f5" font-size="30" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Good design · Desirable × Feasible × Viable</text>

  <!-- Diagram (original inline SVG content, repositioned) -->
  <g transform="translate(40,116)">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
          </pattern>
          <clipPath id="clip-center">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-center-2">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="1000" height="500" fill="#2d3142"/>
        <rect width="1000" height="500" fill="url(#dots)" opacity="0.55"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle cx="500" cy="180" r="140" fill="rgba(245,245,245,0.04)" stroke="#f5f5f5" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle cx="428" cy="320" r="140" fill="rgba(191,192,192,0.05)" stroke="#bfc0c0" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle cx="572" cy="320" r="140" fill="rgba(142,140,131,0.05)" stroke="#8e98ac" stroke-width="1"/>

        <!-- Coral focal tint on the all-three intersection -->
        <g clip-path="url(#clip-center)">
          <g clip-path="url(#clip-center-2)">
            <circle cx="572" cy="320" r="140" fill="rgba(240,138,89,0.14)"/>
          </g>
        </g>

        <!-- Set labels -->
        <text x="500" y="20" fill="#f5f5f5" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Desirable</text>
        <text x="500" y="36" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">PEOPLE WANT IT</text>

        <text x="152" y="400" fill="#bfc0c0" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="start">Feasible</text>
        <text x="152" y="416" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="start" letter-spacing="0.14em">WE CAN BUILD IT</text>

        <text x="848" y="400" fill="#8e98ac" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="end">Viable</text>
        <text x="848" y="416" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.14em">BUSINESS SUSTAINS</text>

        <!-- Pairwise intersection labels -->
        <text x="360" y="232" fill="#bfc0c0" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Prototype</text>
        <text x="360" y="248" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">no business model</text>

        <text x="640" y="232" fill="#bfc0c0" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Vaporware</text>
        <text x="640" y="248" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">can't build it</text>

        <text x="500" y="368" fill="#bfc0c0" font-size="12" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Internal tool</text>
        <text x="500" y="384" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">nobody wants it</text>

        <!-- Focal: all-three center -->
        <text x="500" y="260" fill="#f08a59" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Shippable</text>
        <text x="500" y="276" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">THE SWEET SPOT</text>

        <!-- Legend strip -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="none" stroke="#f08a59" stroke-width="1.2"/>
        <text x="68" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">All three — ship it</text>

        <circle cx="192" cy="488" r="6" fill="none" stroke="#bfc0c0" stroke-width="1"/>
        <text x="208" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Two of three — incomplete</text>

        <text x="380" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-style="italic">Coral marks the intersection that earns the work. The others name the traps.</text>
  </g>
</svg>
