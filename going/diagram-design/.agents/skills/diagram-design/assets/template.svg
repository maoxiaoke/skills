<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 752" width="1064" height="752">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

    <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
    <!--
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    -->
  </defs>

  <!-- Page background (paper) -->
  <rect width="1064" height="752" fill="#f5f5f5"/>

  <!-- Page header: eyebrow + title (redrawn from HTML wrapper) -->
  <text x="32" y="56" fill="#4f5d75" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">[TYPE] · DIAGRAM DESIGN</text>
  <text x="32" y="90" fill="#2d3142" font-size="32" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">[Diagram title]</text>

  <!-- Diagram (original inline SVG content, viewBox 0 0 1000 600) -->
  <g transform="translate(32,120)">
    <rect width="1000" height="600" fill="#f5f5f5"/>
    <!-- <rect width="1000" height="600" fill="url(#dots)" opacity="0.55"/> -->

    <!-- Draw arrows first, then nodes. Replace with your content. -->

  </g>
</svg>
