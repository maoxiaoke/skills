<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 1140" width="1128" height="1140">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper) + full-bleed dot grid -->
  <rect width="1128" height="1140" fill="#f5f5f5"/>
  <rect width="1128" height="1140" fill="url(#dots)" opacity="0.55"/>

  <!-- Header: eyebrow + title + subtitle -->
  <text x="40" y="58" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">NESTED · DIAGRAM DESIGN</text>
  <text x="40" y="102" fill="#2d3142" font-size="40" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">The CLAUDE.md Hierarchy</text>
  <text x="40" y="130" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="40" y="130">How Claude Code composes context from every folder</tspan>
    <tspan x="40" y="155">level above. Each outer ring is a broader scope; the</tspan>
    <tspan x="40" y="180">innermost box is where the work happens — inheriting</tspan>
    <tspan x="40" y="205">every instruction above it without a single import</tspan>
    <tspan x="40" y="230">statement.</tspan>
  </text>

  <!-- Diagram container framing -->
  <rect x="40.5" y="275.5" width="1047" height="547" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Original diagram (viewBox 0 0 1000 500), positioned inside the container -->
  <g transform="translate(64,299)">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="1000" height="500" fill="#f5f5f5"/>
        <rect width="1000" height="500" fill="url(#dots)" opacity="0.55"/>

        <!-- Level 1: ~/.claude/ (global) — outermost -->
        <rect x="40" y="60" width="920" height="380" rx="8" fill="rgba(45,49,66,0.015)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <!-- Level 2: ~/vault/ -->
        <rect x="72" y="96" width="856" height="308" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        <!-- Level 3: /business -->
        <rect x="104" y="132" width="792" height="236" rx="8" fill="rgba(45,49,66,0.025)" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <!-- Level 4: /marketing -->
        <rect x="136" y="168" width="728" height="164" rx="8" fill="rgba(45,49,66,0.03)" stroke="#4f5d75" stroke-width="1"/>
        <!-- Level 5: /project — innermost, coral focal -->
        <rect x="168" y="204" width="664" height="92" rx="8" fill="rgba(235,108,54,0.06)" stroke="#eb6c36" stroke-width="1"/>

        <!-- Level labels on paper-2-colored masks (match diagram-container bg) -->
        <rect x="56" y="52" width="188" height="16" fill="#ececec"/>
        <text x="64" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">~/.claude/ (global)</text>

        <rect x="88" y="88" width="148" height="16" fill="#ececec"/>
        <text x="96" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">~/vault/ (notes)</text>

        <rect x="120" y="124" width="96" height="16" fill="#ececec"/>
        <text x="128" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">/business</text>

        <rect x="152" y="160" width="108" height="16" fill="#ececec"/>
        <text x="160" y="172" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">/marketing</text>

        <rect x="184" y="196" width="88" height="16" fill="#ececec"/>
        <text x="192" y="208" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em" font-weight="600">/project</text>

        <!-- File-icon glyphs inside each level -->
        <g transform="translate(908, 408)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ececec" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.35)" stroke-width="1"/>
        </g>
        <g transform="translate(876, 372)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ececec" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
        </g>
        <g transform="translate(844, 336)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ececec" stroke="rgba(45,49,66,0.50)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(45,49,66,0.50)" stroke-width="1"/>
        </g>
        <g transform="translate(812, 300)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="#4f5d75" stroke-width="1"/>
        </g>

        <!-- Innermost label — human readable -->
        <text x="500" y="248" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">CLAUDE.md</text>
        <text x="500" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">inherits every level above</text>

        <!-- Annotation top-right: italic callout with curved arrow -->
        <text x="904" y="36" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" text-anchor="end">no imports, no configuration</text>
        <path d="M 820 44 Q 700 84 520 216" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="520" cy="216" r="2" fill="#2d3142"/>

        <!-- Annotation bottom-left: italic callout -->
        <text x="40" y="484" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">structure IS the index</text>
  </g>

  <!-- Explanation cards -->
  <!-- Card 1: The headline / Containment is the config -->
  <rect x="40.5" y="847.5" width="371" height="190" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="60" y="875" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
  <circle cx="63.5" cy="894.5" r="3.5" fill="#eb6c36"/>
  <text x="77" y="899" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Containment is the config</text>
  <line x1="60" y1="915" x2="392" y2="915" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="60" y="937" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="60" y="937">Every CLAUDE.md inside a parent folder</tspan>
    <tspan x="60" y="957">implicitly wraps the one below. No manifest,</tspan>
    <tspan x="60" y="977">no import graph — the file tree itself</tspan>
    <tspan x="60" y="997">declares scope, so renaming a folder is the</tspan>
    <tspan x="60" y="1017">only migration you'll ever run.</tspan>
  </text>

  <!-- Card 2: Reads outside-in -->
  <rect x="428.5" y="847.5" width="338" height="190" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="451.5" cy="874.5" r="3.5" fill="#2d3142"/>
  <text x="465" y="879" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Reads outside-in</text>
  <line x1="448" y1="895" x2="747" y2="895" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="448" y="919" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="448" y="919" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462" y="919">Global rules load first</tspan>
    <tspan x="448" y="943" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462" y="943">Each parent narrows context</tspan>
    <tspan x="448" y="967" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462" y="967">Innermost file gets the last word</tspan>
    <tspan x="448" y="991" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462" y="991">Conflicts resolve by specificity</tspan>
  </text>

  <!-- Card 3: Five levels is the ceiling -->
  <rect x="783.5" y="847.5" width="304" height="190" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="806.5" cy="874.5" r="3.5" fill="#4f5d75"/>
  <text x="820" y="879" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Five levels is the ceiling</text>
  <line x1="803" y1="895" x2="1068" y2="895" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="803" y="919" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="803" y="919">Past five rings the diagram stops</tspan>
    <tspan x="803" y="939">teaching — and so does the</tspan>
    <tspan x="803" y="959">filesystem. If you need six levels</tspan>
    <tspan x="803" y="979">of instruction, you probably need</tspan>
    <tspan x="803" y="999">two projects instead.</tspan>
  </text>

  <!-- Footer -->
  <line x1="40" y1="1070" x2="1088" y2="1070" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="40" y="1098" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">the claude.md hierarchy · nested containment</text>
  <text x="1088" y="1098" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
