<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1112 1048" width="1112" height="1048">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <!-- Page background -->
  <rect width="1112" height="1048" fill="#f5f5f5"/>
  <rect width="1112" height="1048" fill="url(#dots)" opacity="0.55"/>

  <!-- Header (redrawn from HTML wrapper) -->
  <text x="32" y="58" fill="#4f5d75" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">STATE MACHINE · DIAGRAM DESIGN</text>
  <text x="32" y="104" fill="#2d3142" font-size="40" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Article lifecycle</text>
  <text x="32" y="134" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="32" dy="0">The four states a post passes through from draft to</tspan>
    <tspan x="32" dy="25">archive, with the rejection loop made explicit. Published</tspan>
    <tspan x="32" dy="25">is the state the team optimizes for — hence coral.</tspan>
  </text>

  <!-- Diagram container -->
  <rect x="32" y="230" width="1048" height="508" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Diagram (original inline SVG content, viewBox 0 0 1000 460) -->
  <g transform="translate(56,254)">
    <rect width="1000" height="460" fill="#f5f5f5"/>
    <rect width="1000" height="460" fill="url(#dots)" opacity="0.55"/>

    <!-- Transitions (drawn first) -->
    <!-- Start → Draft -->
    <line x1="68" y1="200" x2="120" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Draft → In Review -->
    <line x1="280" y1="200" x2="340" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- In Review → Published (coral — happy path) -->
    <line x1="500" y1="200" x2="560" y2="200" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- Published → Archived (down) -->
    <line x1="640" y1="240" x2="640" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- Archived → End (down) -->
    <line x1="640" y1="400" x2="640" y2="432" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- In Review → Draft (curved back up-and-left) -->
    <path d="M 420 160 C 420 96, 200 96, 200 160" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

    <!-- Transition labels -->
    <rect x="172" y="184" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="196" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CREATE</text>

    <rect x="288" y="184" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="312" y="194" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">SUBMIT</text>

    <rect x="500" y="184" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="530" y="194" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">APPROVE</text>

    <rect x="612" y="264" width="56" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="274" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">EXPIRE</text>

    <rect x="620" y="416" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="640" y="426" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">PURGE</text>

    <!-- Reject label on curved path -->
    <rect x="276" y="92" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="316" y="102" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">REJECT · REVISE</text>

    <!-- Start dot (filled ink) -->
    <circle cx="60" cy="200" r="6" fill="#2d3142"/>

    <!-- State: Draft -->
    <rect x="120" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="128" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="148" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="200" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Draft</text>
    <text x="200" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">unpublished</text>

    <!-- State: In Review -->
    <rect x="340" y="160" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <rect x="348" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
    <text x="368" y="177" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="420" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">In Review</text>
    <text x="420" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">awaiting approval</text>

    <!-- State: Published (focal coral) -->
    <rect x="560" y="160" width="160" height="80" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <rect x="568" y="168" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
    <text x="588" y="177" fill="#eb6c36" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="640" y="208" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Published</text>
    <text x="640" y="224" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">live on site</text>

    <!-- State: Archived -->
    <rect x="560" y="300" width="160" height="100" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <rect x="568" y="308" width="40" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
    <text x="588" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
    <text x="640" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Archived</text>
    <text x="640" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">noindex · hidden</text>
    <text x="640" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">redirect retained</text>

    <!-- End ring dot -->
    <circle cx="640" cy="440" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
    <circle cx="640" cy="440" r="5" fill="#2d3142"/>
  </g>

  <!-- Explanation cards (redrawn from HTML .cards grid, columns 1.1fr / 1fr / 0.9fr) -->
  <!-- Card 1: The headline -->
  <g>
    <rect x="32" y="762" width="372" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="52" y="788" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
    <circle cx="56" cy="806" r="3.5" fill="#eb6c36"/>
    <text x="67" y="810" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Published is the win state</text>
    <line x1="52" y1="822" x2="384" y2="822" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="52" y="842" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="52" dy="0">Everything flows toward Published. The</tspan>
      <tspan x="52" dy="20">rejection loop is dashed because it's a</tspan>
      <tspan x="52" dy="20">detour, not a failure — the article is</tspan>
      <tspan x="52" dy="20">still in-progress.</tspan>
    </text>
  </g>

  <!-- Card 2: Reject is a loop -->
  <g>
    <rect x="420" y="762" width="339" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <circle cx="444" cy="789" r="3.5" fill="#2d3142"/>
    <text x="455" y="793" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Reject is a loop, not a dead-end</text>
    <line x1="440" y1="805" x2="739" y2="805" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="440" y="827" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="440" dy="0" fill="rgba(45,49,66,0.25)">—</tspan><tspan dx="5" fill="#4f5d75">Dashed to signal detour</tspan>
      <tspan x="440" dy="25" fill="rgba(45,49,66,0.25)">—</tspan><tspan dx="5" fill="#4f5d75">Returns to Draft, not a new state</tspan>
      <tspan x="440" dy="25" fill="rgba(45,49,66,0.25)">—</tspan><tspan dx="5" fill="#4f5d75">Review feedback is the action</tspan>
    </text>
  </g>

  <!-- Card 3: Archive keeps the URL -->
  <g>
    <rect x="775" y="762" width="305" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <circle cx="799" cy="789" r="3.5" fill="#4f5d75"/>
    <text x="810" y="793" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Archive keeps the URL</text>
    <line x1="795" y1="805" x2="1060" y2="805" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="795" y="827" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="795" dy="0">Archived preserves the redirect</tspan>
      <tspan x="795" dy="20">map so inbound links survive. Only</tspan>
      <tspan x="795" dy="20">Purge removes the record entirely.</tspan>
    </text>
  </g>

  <!-- Footer -->
  <line x1="32" y1="966" x2="1080" y2="966" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="32" y="994" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">article lifecycle · state machine</text>
  <text x="1080" y="994" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
