<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 1056" width="1128" height="1056">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background -->
  <rect width="1128" height="1056" fill="#f5f5f5"/>
  <rect width="1128" height="1056" fill="url(#dots)" opacity="0.55"/>

  <!-- Header (redrawn HTML wrapper) -->
  <text x="40" y="54" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">SWIMLANE · DIAGRAM DESIGN</text>
  <text x="40" y="98" fill="#2d3142" font-size="40" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Publishing an article</text>
  <text x="40" y="126" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="40" dy="0">Four actors, seven steps, three handoffs. The step</tspan>
    <tspan x="40" dy="25">each person owns lives in their lane — arrows crossing</tspan>
    <tspan x="40" dy="25">lanes are where coordination happens.</tspan>
  </text>

  <!-- Diagram container framing -->
  <rect x="40" y="220" width="1048" height="528" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Diagram (original inline SVG content, viewBox 0 0 1000 480) -->
  <g transform="translate(64,244)">
    <defs>
      <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
        <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
      </pattern>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <rect width="1000" height="480" fill="#f5f5f5"/>
    <rect width="1000" height="480" fill="url(#dots)" opacity="0.55"/>

    <!-- Lane dividers -->
    <line x1="40" y1="80" x2="960" y2="80" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
    <line x1="40" y1="160" x2="960" y2="160" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="240" x2="960" y2="240" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="320" x2="960" y2="320" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
    <line x1="40" y1="400" x2="960" y2="400" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

    <!-- Actor column divider -->
    <line x1="160" y1="80" x2="160" y2="400" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>

    <!-- Lane labels -->
    <text x="60" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">AUTHOR</text>
    <text x="60" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">REVIEWER</text>
    <text x="60" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">EDITOR</text>
    <text x="60" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">CI / CD</text>

    <!-- Arrows (drawn first) -->
    <!-- 1. Draft → Open PR (within Author) -->
    <line x1="300" y1="120" x2="340" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 2. Open PR → Review (Author → Reviewer handoff, diagonal down-right) -->
    <line x1="460" y1="144" x2="500" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 3. Review → Polish (Reviewer → Editor, vertical down) -->
    <line x1="570" y1="224" x2="570" y2="256" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <!-- 4. Polish → Approve (within Editor) -->
    <line x1="640" y1="280" x2="680" y2="280" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <!-- 5. Approve → Build (Editor → CI/CD, coral handoff) -->
    <line x1="750" y1="304" x2="720" y2="336" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <!-- 6. Build → Deploy (within CI/CD) -->
    <line x1="760" y1="360" x2="800" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- Arrow labels -->
    <rect x="452" y="140" width="60" height="12" rx="2" fill="#f5f5f5"/>
    <text x="482" y="150" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">HANDOFF</text>

    <rect x="548" y="228" width="52" height="12" rx="2" fill="#ececec"/>
    <text x="574" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">REVISE</text>

    <rect x="712" y="308" width="80" height="12" rx="2" fill="#f5f5f5"/>
    <text x="752" y="318" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">DEPLOY TRIGGER</text>

    <!-- Steps -->
    <!-- Author: Draft MDX -->
    <rect x="180" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="240" y="118" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Draft MDX</text>
    <text x="240" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">src/content/…</text>

    <!-- Author: Open PR -->
    <rect x="340" y="96" width="120" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="400" y="118" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Open PR</text>
    <text x="400" y="132" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">gh pr create</text>

    <!-- Reviewer: Review content -->
    <rect x="500" y="176" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="570" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Review content</text>
    <text x="570" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">fact-check · voice</text>

    <!-- Editor: Polish copy -->
    <rect x="500" y="256" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="570" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Polish copy</text>
    <text x="570" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">style · line edits</text>

    <!-- Editor: Approve merge -->
    <rect x="680" y="256" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="750" y="278" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Approve merge</text>
    <text x="750" y="292" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">squash · main</text>

    <!-- CI/CD: Build -->
    <rect x="680" y="336" width="80" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="720" y="358" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Build</text>
    <text x="720" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">astro build</text>

    <!-- CI/CD: Deploy (coral focal) -->
    <rect x="800" y="336" width="120" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="860" y="358" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" text-anchor="middle">Deploy</text>
    <text x="860" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle">cloudflare pages</text>

    <!-- Legend -->
    <line x1="40" y1="428" x2="960" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="40" y="444" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

    <rect x="40" y="460" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="60" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Step</text>

    <rect x="132" y="460" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="152" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Focal outcome</text>

    <line x1="268" y1="466" x2="296" y2="466" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="304" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Within-lane step</text>

    <line x1="444" y1="466" x2="472" y2="466" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
    <text x="480" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Revision loop</text>

    <line x1="608" y1="466" x2="636" y2="466" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
    <text x="644" y="468" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Critical handoff</text>
  </g>

  <!-- Explanation cards (redrawn from HTML grid: 1.1fr / 1fr / 0.9fr) -->
  <!-- Card 1: The headline -->
  <rect x="40" y="772" width="372" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="60" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
  <circle cx="64" cy="815" r="3.5" fill="#eb6c36"/>
  <text x="76" y="819" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">The deploy trigger is the risky edge</text>
  <line x1="60" y1="833" x2="392" y2="833" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="60" y="857" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="60" dy="0">Every other step lives inside one person's</tspan>
    <tspan x="60" dy="20">head. The Editor→CI/CD handoff is where</tspan>
    <tspan x="60" dy="20">automation takes over and humans lose the</tspan>
    <tspan x="60" dy="20">ability to undo — hence coral.</tspan>
  </text>

  <!-- Card 2: One owner per step -->
  <rect x="428" y="772" width="339" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="452" cy="799" r="3.5" fill="#2d3142"/>
  <text x="464" y="803" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">One owner per step</text>
  <line x1="448" y1="821" x2="747" y2="821" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="448" y="845" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="448" dy="0" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" dy="0">No step crosses two lanes</tspan>
    <tspan x="448" dy="20" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" dy="0">Handoffs are arrows, not shared steps</tspan>
    <tspan x="448" dy="20" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" dy="0">Dashed arrow = revision detour</tspan>
  </text>

  <!-- Card 3: Uneven step counts are fine -->
  <rect x="783" y="772" width="305" height="172" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="807" cy="799" r="3.5" fill="#4f5d75"/>
  <text x="819" y="803" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Uneven step counts are fine</text>
  <line x1="803" y1="821" x2="1068" y2="821" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text x="803" y="845" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="803" dy="0">The Reviewer lane has one step;</tspan>
    <tspan x="803" dy="20">CI/CD has two. Lanes don't need to</tspan>
    <tspan x="803" dy="20">match — they exist to make</tspan>
    <tspan x="803" dy="20">ownership unambiguous.</tspan>
  </text>

  <!-- Footer -->
  <line x1="40" y1="976" x2="1088" y2="976" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="40" y="1008" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">publishing an article · swimlane</text>
  <text x="1088" y="1008" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
