<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 656" width="1080" height="656">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper, dark) -->
  <rect width="1080" height="656" fill="#2d3142"/>

  <!-- Header: eyebrow + title -->
  <text x="40" y="48" fill="#bfc0c0" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">QUADRANT · DIAGRAM DESIGN</text>
  <text x="40" y="88" fill="#f5f5f5" font-size="30" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Content ideas · Impact × Effort</text>

  <!-- Diagram (original inline SVG content, repositioned) -->
  <g transform="translate(40,116)">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(245,245,245,0.10)"/>
          </pattern>
        </defs>

        <rect width="1000" height="500" fill="#2d3142"/>
        <rect width="1000" height="500" fill="url(#dots)" opacity="0.55"/>

        <!-- Quadrant backgrounds (very subtle, only coral on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(240,138,89,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(245,245,245,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(245,245,245,0.45)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.14em">HIGH EFFORT →</text>
        <text x="120" y="266" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">← LOW EFFORT</text>
        <text x="512" y="80" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">↑ HIGH IMPACT</text>
        <text x="512" y="432" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">↓ LOW IMPACT</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#f08a59" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em" font-weight="600">DO FIRST</text>
        <text x="860" y="104" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.18em">MAJOR PROJECTS</text>
        <text x="140" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">QUICK WINS</text>
        <text x="860" y="412" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL (Do First) -->
        <!-- coral focal -->
        <circle cx="220" cy="140" r="6" fill="#f08a59"/>
        <text x="232" y="144" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Schematic skill v4</text>

        <circle cx="320" cy="200" r="4" fill="#f5f5f5"/>
        <text x="332" y="204" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Update changelog</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="#f5f5f5"/>
        <text x="632" y="144" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Design v4 refresh</text>

        <circle cx="760" cy="180" r="4" fill="#f5f5f5"/>
        <text x="772" y="184" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">New publication</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="#f5f5f5"/>
        <text x="272" y="324" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Fix footer link</text>

        <circle cx="360" cy="380" r="4" fill="#f5f5f5"/>
        <text x="372" y="384" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Update OG tags</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="#f5f5f5"/>
        <text x="652" y="384" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Rewrite build pipeline</text>

        <circle cx="780" cy="320" r="4" fill="#f5f5f5"/>
        <text x="792" y="324" fill="#bfc0c0" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Port to Nuxt</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(245,245,245,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="#f08a59"/>
        <text x="68" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Start tomorrow</text>

        <circle cx="192" cy="488" r="4" fill="#f5f5f5"/>
        <text x="208" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Candidate project</text>

        <text x="336" y="492" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-style="italic">Position is the signal. Colour is reserved for the single action item.</text>
  </g>
</svg>
