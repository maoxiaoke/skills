<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 1072" width="1128" height="1072">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper) -->
  <rect width="1128" height="1072" fill="#f5f5f5"/>

  <!-- Header: eyebrow + title + subtitle -->
  <text x="40" y="48" fill="#4f5d75" font-size="10.5" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">QUADRANT · DIAGRAM DESIGN</text>
  <text x="40" y="92" fill="#2d3142" font-size="38" font-weight="400" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Content ideas · Impact × Effort</text>
  <text x="40" y="121" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="40" y="121">Eight candidate projects mapped by the pay-off they'd</tspan>
    <tspan x="40" y="146">generate against the cost to ship. Position is the signal —</tspan>
    <tspan x="40" y="171">color is reserved for the one item worth starting</tspan>
    <tspan x="40" y="196">tomorrow.</tspan>
  </text>

  <!-- Diagram container -->
  <rect x="40.5" y="236.5" width="1047" height="547" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Diagram (original inline SVG content, repositioned inside container) -->
  <g transform="translate(64,260)">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
        </defs>

        <rect width="1000" height="500" fill="#f5f5f5"/>
        <rect width="1000" height="500" fill="url(#dots)" opacity="0.55"/>

        <!-- Quadrant backgrounds (very subtle, only coral on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(235,108,54,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(45,49,66,0.45)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.14em">HIGH EFFORT →</text>
        <text x="120" y="266" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">← LOW EFFORT</text>
        <text x="512" y="80" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">↑ HIGH IMPACT</text>
        <text x="512" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">↓ LOW IMPACT</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#eb6c36" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em" font-weight="600">DO FIRST</text>
        <text x="860" y="104" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.18em">MAJOR PROJECTS</text>
        <text x="140" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">QUICK WINS</text>
        <text x="860" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end" letter-spacing="0.18em">AVOID</text>

        <!-- Items: TL (Do First) -->
        <!-- coral focal -->
        <circle cx="220" cy="140" r="6" fill="#eb6c36"/>
        <text x="232" y="144" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Schematic skill v4</text>

        <circle cx="320" cy="200" r="4" fill="#2d3142"/>
        <text x="332" y="204" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Update changelog</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="#2d3142"/>
        <text x="632" y="144" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Design v4 refresh</text>

        <circle cx="760" cy="180" r="4" fill="#2d3142"/>
        <text x="772" y="184" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">New publication</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="#2d3142"/>
        <text x="272" y="324" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Fix footer link</text>

        <circle cx="360" cy="380" r="4" fill="#2d3142"/>
        <text x="372" y="384" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Update OG tags</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="#2d3142"/>
        <text x="652" y="384" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Rewrite build pipeline</text>

        <circle cx="780" cy="320" r="4" fill="#2d3142"/>
        <text x="792" y="324" fill="#4f5d75" font-size="11" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Port to Nuxt</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <circle cx="52" cy="488" r="6" fill="#eb6c36"/>
        <text x="68" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Start tomorrow</text>

        <circle cx="192" cy="488" r="4" fill="#2d3142"/>
        <text x="208" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Candidate project</text>

        <text x="336" y="492" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-style="italic">Position is the signal. Colour is reserved for the single action item.</text>
  </g>

  <!-- Explanation cards -->
  <!-- Card 1: THE HEADLINE · One coral dot, on purpose (coral dot) -->
  <rect x="40.5" y="808.5" width="371" height="163" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="60" y="836" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
  <circle cx="63.5" cy="852" r="3.5" fill="#eb6c36"/>
  <text x="74" y="856" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">One coral dot, on purpose</text>
  <line x1="60" y1="868" x2="392" y2="868" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="60" y="890">A 2×2 with four coloured quadrants is a</tspan>
    <tspan x="60" y="910">poster, not a decision tool. Reserving coral</tspan>
    <tspan x="60" y="930">for the single item you commit to tomorrow</tspan>
    <tspan x="60" y="950">makes the matrix actually prioritise.</tspan>
  </text>

  <!-- Card 2: Axes labelled at ends (ink dot, dashed list) -->
  <rect x="428.5" y="808.5" width="338" height="163" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="451.5" cy="835" r="3.5" fill="#2d3142"/>
  <text x="462" y="839" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Axes labelled at ends</text>
  <line x1="448" y1="851" x2="747" y2="851" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="448" y="874" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" y="874">HIGH / LOW at the extremes</tspan>
    <tspan x="448" y="899" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" y="899">Arrows show direction</tspan>
    <tspan x="448" y="924" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" y="924">No labels at midpoints</tspan>
    <tspan x="448" y="949" fill="rgba(45,49,66,0.25)" font-size="12">—</tspan><tspan x="462" y="949">The cross is 1px ink, not a box</tspan>
  </text>

  <!-- Card 3: Empty BR isn't wasted (muted dot) -->
  <rect x="783.5" y="808.5" width="304" height="163" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <circle cx="806.5" cy="835" r="3.5" fill="#4f5d75"/>
  <text x="817" y="839" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Empty BR isn't wasted</text>
  <line x1="803" y1="851" x2="1067" y2="851" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
  <text fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="803" y="873">Two items in "Avoid" is informative</tspan>
    <tspan x="803" y="893">— it says the team considered</tspan>
    <tspan x="803" y="913">them and rejected them. A blank</tspan>
    <tspan x="803" y="933">quadrant would leave you wondering.</tspan>
  </text>

  <!-- Footer -->
  <line x1="40" y1="1004" x2="1088" y2="1004" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="40" y="1037" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">content ideas · impact × effort</text>
  <text x="1088" y="1037" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
