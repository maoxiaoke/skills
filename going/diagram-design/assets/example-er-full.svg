<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 1020" width="1128" height="1020">
  <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>

  <!-- Page background (paper) + dots texture -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <!-- Page header: eyebrow + title + subtitle -->
  <text x="40" y="48" fill="#4f5d75" font-size="11" font-weight="500" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">ER · DIAGRAM DESIGN</text>
  <text x="40" y="94" fill="#2d3142" font-size="40" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" letter-spacing="-0.02em">Content platform · data model</text>
  <text x="40" y="124" fill="#4f5d75" font-size="16" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
    <tspan x="40" dy="0">The four entities behind the site. Article is the</tspan>
    <tspan x="40" dy="25">aggregate root — everything else exists to describe or</tspan>
    <tspan x="40" dy="25">classify it. `#` marks primary keys, `→` marks foreign keys.</tspan>
  </text>

  <!-- Diagram container framing -->
  <rect x="40" y="212" width="1048" height="528" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>

  <!-- Diagram (original inline SVG content, viewBox 0 0 1000 480) -->
  <g transform="translate(64,236)">
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="1000" height="480" fill="#f5f5f5"/>
        <rect width="1000" height="480" fill="url(#dots)" opacity="0.55"/>

        <!-- Relationship lines (drawn first) -->
        <!-- 1. Author — Article (1:N "writes") -->
        <line x1="260" y1="240" x2="400" y2="240" stroke="#4f5d75" stroke-width="1" />
        <!-- 2. Article — ArticleTag (1:N) -->
        <line x1="640" y1="320" x2="780" y2="328" stroke="#4f5d75" stroke-width="1" />
        <!-- 3. Tag — ArticleTag (1:N, vertical) -->
        <line x1="880" y1="248" x2="880" y2="280" stroke="#4f5d75" stroke-width="1" />

        <!-- Cardinality labels -->
        <rect x="266" y="232" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="242" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="378" y="232" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="386" y="242" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="646" y="316" width="12" height="12" rx="2" fill="#f5f5f5"/>
        <text x="652" y="326" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="760" y="324" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="334" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="872" y="252" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="880" y="262" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="872" y="268" width="16" height="12" rx="2" fill="#f5f5f5"/>
        <text x="880" y="278" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" font-weight="600">N</text>

        <!-- Relationship labels -->
        <rect x="304" y="220" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="332" y="230" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">WRITES</text>

        <rect x="688" y="300" width="56" height="14" rx="2" fill="#f5f5f5"/>
        <text x="716" y="310" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="middle" letter-spacing="0.12em">TAGGED</text>

        <!-- Entity: Author -->
        <rect x="60" y="160" width="200" height="160" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="60" y="160" width="200" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="60" y="192" width="200" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="76" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="76" y="192" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Author</text>
        <text x="76" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace"># id</text>
        <text x="220" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>
        <text x="76" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">handle</text>
        <text x="220" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="76" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">name</text>
        <text x="220" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="76" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">bio</text>
        <text x="220" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="76" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">site_url</text>
        <text x="220" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>

        <!-- Entity: Article (focal coral) -->
        <rect x="400" y="120" width="240" height="240" rx="6" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="400" y="120" width="240" height="40" rx="6" fill="rgba(235,108,54,0.10)" stroke="none"/>
        <rect x="400" y="152" width="240" height="8" fill="rgba(235,108,54,0.10)"/>
        <line x1="400" y1="160" x2="640" y2="160" stroke="rgba(235,108,54,0.40)" stroke-width="1"/>
        <text x="416" y="136" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="416" y="152" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Article</text>
        <text x="416" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace"># id</text>
        <text x="600" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>
        <text x="416" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">title</text>
        <text x="600" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="416" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">slug</text>
        <text x="600" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text · unique</text>
        <text x="416" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">body_mdx</text>
        <text x="600" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="416" y="260" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">published_at</text>
        <text x="600" y="260" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">timestamp</text>
        <text x="416" y="280" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">→ author_id</text>
        <text x="600" y="280" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>
        <text x="416" y="300" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">status</text>
        <text x="600" y="300" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">enum</text>
        <text x="416" y="320" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">og_image</text>
        <text x="600" y="320" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text · url</text>

        <!-- Entity: Tag -->
        <rect x="780" y="120" width="200" height="128" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="780" y="120" width="200" height="40" rx="6" fill="rgba(45,49,66,0.04)" stroke="none"/>
        <rect x="780" y="152" width="200" height="8" fill="rgba(45,49,66,0.04)"/>
        <line x1="780" y1="160" x2="980" y2="160" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="796" y="136" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="796" y="152" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Tag</text>
        <text x="796" y="180" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace"># id</text>
        <text x="940" y="180" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>
        <text x="796" y="200" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">slug</text>
        <text x="940" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text · unique</text>
        <text x="796" y="220" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">name</text>
        <text x="940" y="220" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>
        <text x="796" y="240" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">description</text>
        <text x="940" y="240" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">text</text>

        <!-- Entity: ArticleTag (join) -->
        <rect x="780" y="280" width="200" height="96" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="780" y="280" width="200" height="40" rx="6" fill="rgba(45,49,66,0.06)" stroke="none"/>
        <rect x="780" y="312" width="200" height="8" fill="rgba(45,49,66,0.06)"/>
        <line x1="780" y1="320" x2="980" y2="320" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="796" y="296" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.14em">JOIN</text>
        <text x="796" y="312" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">ArticleTag</text>
        <text x="796" y="340" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">→ article_id</text>
        <text x="940" y="340" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>
        <text x="796" y="360" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace">→ tag_id</text>
        <text x="940" y="360" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" text-anchor="end">uuid</text>

        <!-- Legend -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(235,108,54,0.04)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Aggregate root</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="200" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Entity</text>

        <rect x="268" y="436" width="14" height="10" rx="2" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="288" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Join table</text>

        <text x="372" y="444" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600">#</text>
        <text x="388" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Primary key</text>

        <text x="476" y="444" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600">→</text>
        <text x="492" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Foreign key</text>

        <text x="584" y="444" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-weight="600">1 / N</text>
        <text x="616" y="444" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Cardinality</text>
  </g>

  <!-- Explanation cards -->
  <!-- Card 1: The headline -->
  <g>
    <rect x="40" y="764" width="372" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <text x="60" y="792" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.18em">THE HEADLINE</text>
    <circle cx="64" cy="812" r="3.5" fill="#eb6c36"/>
    <text x="75" y="816" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Article is the root</text>
    <line x1="60" y1="830" x2="392" y2="830" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="60" y="852" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="60" dy="0">Author, Tag, and the join table only exist to</tspan>
      <tspan x="60" dy="20">describe Article. If you're thinking about a</tspan>
      <tspan x="60" dy="20">feature, start here and trace outward.</tspan>
    </text>
  </g>

  <!-- Card 2: Many-to-many via a join -->
  <g>
    <rect x="428" y="764" width="339" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <circle cx="452" cy="798" r="3.5" fill="#2d3142"/>
    <text x="463" y="802" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Many-to-many via a join</text>
    <line x1="448" y1="816" x2="747" y2="816" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="448" y="838" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="448" dy="0" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462" dy="0">Tags aren't embedded on Article</tspan>
      <tspan x="448" dy="20" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462">ArticleTag is a pure join — no metadata</tspan>
      <tspan x="448" dy="20" fill="rgba(45,49,66,0.25)">—</tspan><tspan x="462">Dashed border signals it's not a primary</tspan>
      <tspan x="462" dy="20">entity</tspan>
    </text>
  </g>

  <!-- Card 3: Cardinality over arrows -->
  <g>
    <rect x="783" y="764" width="305" height="160" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
    <circle cx="807" cy="798" r="3.5" fill="#4f5d75"/>
    <text x="818" y="802" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">Cardinality over arrows</text>
    <line x1="803" y1="816" x2="1068" y2="816" stroke="rgba(45,49,66,0.08)" stroke-width="1"/>
    <text x="803" y="838" fill="#4f5d75" font-size="13" font-family="'Geist', system-ui, -apple-system, 'Helvetica Neue', sans-serif">
      <tspan x="803" dy="0">Plain lines with 1/N at the ends read</tspan>
      <tspan x="803" dy="20">cleaner than crow's feet at this size.</tspan>
      <tspan x="803" dy="20">Every relationship carries both</tspan>
      <tspan x="803" dy="20">numbers.</tspan>
    </text>
  </g>

  <!-- Footer -->
  <line x1="40" y1="956" x2="1088" y2="956" stroke="rgba(45,49,66,0.10)" stroke-width="1"/>
  <text x="40" y="981" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em">Content platform · ER model</text>
  <text x="1088" y="981" fill="#7a8399" font-size="11.5" font-family="'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>
